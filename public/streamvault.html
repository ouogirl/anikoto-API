<style>
  :root {
    --bg: #0b0d10;
    --bg-soft: #101318;
    --panel: #14181e;
    --panel-2: #171c22;
    --panel-hover: #1a2027;

    --ink: #f3f5f7;
    --muted: #8f98a4;
    --muted-2: #69727e;

    --line: #252c35;
    --line-soft: #1d232b;

    --accent: #6ea8ff;
    --accent-hover: #5d99f5;
    --accent-soft: rgba(110,168,255,.12);

    --ok: #59c98a;
    --warn: #e1af55;
    --bad: #ef7373;

    --chip: #1b232d;

    --shadow-sm:
      0 1px 2px rgba(0,0,0,.25);

    --shadow:
      0 10px 35px rgba(0,0,0,.18),
      0 2px 8px rgba(0,0,0,.15);

    --shadow-lg:
      0 24px 60px rgba(0,0,0,.35),
      0 4px 14px rgba(0,0,0,.2);

    --radius-sm: 8px;
    --radius: 12px;
    --radius-lg: 16px;

    --font:
      Inter,
      ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;

    --mono:
      ui-monospace,
      SFMono-Regular,
      Menlo,
      Monaco,
      Consolas,
      monospace;
  }

  * {
    box-sizing: border-box;
  }

  html {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color-scheme: dark;
  }

  body {
    margin: 0;
    min-height: 100vh;

    font-family: var(--font);
    color: var(--ink);

    background:
      radial-gradient(
        900px 420px at 50% -140px,
        rgba(110,168,255,.12),
        transparent 70%
      ),
      linear-gradient(
        180deg,
        #0b0d10 0%,
        #0d1014 45%,
        #0b0d10 100%
      );

    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;

    background:
      linear-gradient(
        rgba(255,255,255,.012) 1px,
        transparent 1px
      );

    background-size: 100% 4px;
    opacity: .12;
  }

  button,
  input,
  select {
    font: inherit;
  }

  button,
  .btn {
    -webkit-tap-highlight-color: transparent;
  }

  a {
    color: var(--accent);
  }

  ::selection {
    background: rgba(110,168,255,.22);
  }

  /* -----------------------------
     Layout
  ----------------------------- */

  .wrap {
    width: min(1080px, calc(100% - 32px));
    margin: 0 auto;
    padding: 34px 0 64px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;

    margin-bottom: 26px;
  }

  .brand {
    min-width: 0;
  }

  .brand h1 {
    margin: 0;

    font-size: 1.7rem;
    line-height: 1.1;
    font-weight: 750;
    letter-spacing: -.035em;
  }

  .brand p {
    margin: 7px 0 0;

    color: var(--muted);
    font-size: .9rem;
    letter-spacing: -.01em;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
  }

  /* -----------------------------
     Status
  ----------------------------- */

  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    min-height: 35px;
    padding: 7px 11px;

    background: rgba(255,255,255,.025);
    border: 1px solid var(--line);

    border-radius: 999px;

    color: var(--muted);
    font-size: .8rem;
    font-weight: 600;

    box-shadow: var(--shadow-sm);
  }

  .dot {
    width: 7px;
    height: 7px;
    flex: 0 0 7px;

    border-radius: 50%;
    background: var(--muted-2);

    box-shadow: 0 0 0 3px rgba(255,255,255,.025);
  }

  .dot.ok {
    background: var(--ok);
    box-shadow:
      0 0 0 3px rgba(89,201,138,.10),
      0 0 10px rgba(89,201,138,.18);
  }

  .dot.bad {
    background: var(--bad);
    box-shadow: 0 0 0 3px rgba(239,115,115,.10);
  }

  .dot.warn {
    background: var(--warn);
    box-shadow: 0 0 0 3px rgba(225,175,85,.10);
  }

  /* -----------------------------
     Panels
  ----------------------------- */

  .panel {
    position: relative;

    background:
      linear-gradient(
        180deg,
        rgba(255,255,255,.018),
        rgba(255,255,255,.008)
      ),
      var(--panel);

    border: 1px solid var(--line-soft);
    border-radius: var(--radius);

    box-shadow: var(--shadow);

    padding: 16px;
    margin-bottom: 14px;
  }

  .panel::after {
    content: "";

    position: absolute;
    inset: 0;

    border-radius: inherit;
    pointer-events: none;

    border: 1px solid rgba(255,255,255,.018);
  }

  /* -----------------------------
     Stats
  ----------------------------- */

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;

    padding: 10px;
  }

  .stat {
    min-width: 0;

    padding: 14px 12px;

    background: rgba(255,255,255,.018);
    border: 1px solid var(--line-soft);

    border-radius: var(--radius-sm);

    text-align: left;

    transition:
      background .15s ease,
      border-color .15s ease,
      transform .15s ease;
  }

  .stat:hover {
    background: rgba(255,255,255,.028);
    border-color: var(--line);
    transform: translateY(-1px);
  }

  .stat b {
    display: block;

    font-size: 1.15rem;
    line-height: 1.15;

    font-weight: 700;
    letter-spacing: -.02em;

    font-variant-numeric: tabular-nums;
  }

  .stat span {
    display: block;

    margin-top: 5px;

    color: var(--muted);
    font-size: .75rem;
    font-weight: 500;
  }

  /* -----------------------------
     Inputs / controls
  ----------------------------- */

  .row {
    display: flex;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
  }

  .grow {
    flex: 1 1 320px;
    min-width: 0;
  }

  input[type="url"],
  input[type="text"],
  input[type="number"],
  select {
    width: 100%;

    min-height: 42px;

    padding: 10px 12px;

    color: var(--ink);
    background: #0f1318;

    border: 1px solid var(--line);
    border-radius: var(--radius-sm);

    outline: none;

    transition:
      border-color .15s ease,
      box-shadow .15s ease,
      background .15s ease;
  }

  input::placeholder {
    color: #626b76;
  }

  input:hover,
  select:hover {
    border-color: #323a45;
  }

  input:focus,
  select:focus {
    background: #10151b;
    border-color: rgba(110,168,255,.7);

    box-shadow:
      0 0 0 3px var(--accent-soft),
      0 1px 2px rgba(0,0,0,.2);
  }

  select {
    width: auto;
    min-width: 82px;

    cursor: pointer;
  }

  button,
  .btn {
    min-height: 40px;

    padding: 9px 13px;

    color: var(--ink);
    background: #171c22;

    border: 1px solid var(--line);
    border-radius: var(--radius-sm);

    cursor: pointer;

    font-size: .86rem;
    font-weight: 600;

    transition:
      transform .12s ease,
      background .15s ease,
      border-color .15s ease,
      box-shadow .15s ease,
      opacity .15s ease;
  }

  button:hover {
    background: var(--panel-hover);
    border-color: #343c47;
  }

  button:active {
    transform: translateY(1px);
  }

  button:focus-visible {
    outline: none;

    box-shadow:
      0 0 0 3px var(--accent-soft);
  }

  .btn-primary {
    background:
      linear-gradient(
        180deg,
        #75aeff 0%,
        #619df0 100%
      );

    border-color: #639ff0;
    color: #07111f;

    font-weight: 750;

    box-shadow:
      0 3px 10px rgba(65,130,220,.16),
      inset 0 1px 0 rgba(255,255,255,.18);
  }

  .btn-primary:hover {
    background:
      linear-gradient(
        180deg,
        #82b8ff 0%,
        #6ca5f4 100%
      );

    border-color: #78aef7;

    box-shadow:
      0 5px 16px rgba(65,130,220,.20),
      inset 0 1px 0 rgba(255,255,255,.22);
  }

  .btn-good {
    background:
      linear-gradient(
        180deg,
        #5ac88a 0%,
        #4ab679 100%
      );

    border-color: #51bd81;
    color: #07160e;

    font-weight: 750;

    box-shadow:
      0 3px 10px rgba(67,181,121,.12),
      inset 0 1px 0 rgba(255,255,255,.15);
  }

  .btn-good:hover {
    background:
      linear-gradient(
        180deg,
        #67d395 0%,
        #53bf81 100%
      );

    border-color: #63ca8e;
  }

  .btn-ghost {
    background: transparent;
    border-color: transparent;
    color: var(--muted);
  }

  .btn-ghost:hover {
    background: rgba(255,255,255,.04);
    border-color: var(--line);
    color: var(--ink);
  }

  .btn-tiny {
    min-height: 30px;

    padding: 5px 9px;

    border-radius: 7px;

    font-size: .74rem;
    font-weight: 650;
  }

  /* -----------------------------
     Hint / notices
  ----------------------------- */

  .hint {
    min-height: 20px;
    margin-top: 9px;

    color: var(--muted-2);
    font-size: .79rem;
  }

  .banner {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;

    margin-bottom: 14px;
    padding: 11px 13px;

    background: rgba(225,175,85,.08);

    border: 1px solid rgba(225,175,85,.2);
    border-radius: var(--radius-sm);

    color: #d6bb82;
    font-size: .82rem;
  }

  .banner button {
    margin-left: auto;
  }

  /* -----------------------------
     Slots
  ----------------------------- */

  .grid2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .slot {
    min-height: 196px;
  }

  .slot h3 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;

    margin: 0 0 13px;

    color: #e9edf1;
    font-size: .84rem;
    font-weight: 650;
  }

  .slot .title {
    margin: 2px 0 4px;

    color: #f0f3f6;

    font-size: .95rem;
    font-weight: 700;
    letter-spacing: -.01em;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .slot .sub {
    color: var(--muted);
    font-size: .78rem;
  }

  .idle {
    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 110px;
    padding: 20px;

    background:
      repeating-linear-gradient(
        135deg,
        rgba(255,255,255,.014) 0,
        rgba(255,255,255,.014) 1px,
        transparent 1px,
        transparent 8px
      );

    border: 1px dashed #29313b;
    border-radius: 9px;

    color: var(--muted-2);

    font-size: .8rem;
  }

  /* -----------------------------
     Chips
  ----------------------------- */

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;

    margin: 10px 0;
  }

  .chip {
    padding: 4px 8px;

    background: var(--chip);
    border: 1px solid #2a3440;

    border-radius: 999px;

    color: #aeb9c6;

    font-size: .67rem;
    font-weight: 700;
    letter-spacing: .03em;

    text-transform: uppercase;
  }

  /* -----------------------------
     Progress
  ----------------------------- */

  .bar {
    position: relative;

    height: 7px;

    margin-top: 8px;

    overflow: hidden;

    background: #0c1014;
    border: 1px solid #242b33;

    border-radius: 999px;
  }

  .bar > i {
    position: relative;

    display: block;

    width: 0%;
    height: 100%;

    background:
      linear-gradient(
        90deg,
        #5d99ee 0%,
        #79b1ff 100%
      );

    border-radius: inherit;

    box-shadow:
      0 0 12px rgba(110,168,255,.2);

    transition: width .2s ease;
  }

  /* -----------------------------
     Slot metadata
  ----------------------------- */

  .meta {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;

    margin-top: 9px;

    color: var(--muted-2);

    font-size: .72rem;
    font-variant-numeric: tabular-nums;
  }

  .meta span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* -----------------------------
     Lists
  ----------------------------- */

  .list {
    max-height: 180px;

    overflow: auto;

    scrollbar-width: thin;
    scrollbar-color: #2c3440 transparent;

    font-size: .8rem;
  }

  .list::-webkit-scrollbar,
  .log::-webkit-scrollbar {
    width: 7px;
  }

  .list::-webkit-scrollbar-track,
  .log::-webkit-scrollbar-track {
    background: transparent;
  }

  .list::-webkit-scrollbar-thumb,
  .log::-webkit-scrollbar-thumb {
    background: #2a323c;
    border-radius: 999px;
  }

  .list-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;

    min-height: 40px;

    padding: 7px 7px;

    border-bottom: 1px solid var(--line-soft);
  }

  .list-item:last-child {
    border-bottom: 0;
  }

  .list-item > span {
    min-width: 0;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .list-item button {
    flex: 0 0 auto;
  }

  /* -----------------------------
     Log
  ----------------------------- */

  .log {
    max-height: 240px;

    padding: 11px 12px;

    overflow: auto;

    background:
      linear-gradient(
        180deg,
        rgba(255,255,255,.012),
        transparent
      ),
      #0c1014;

    border: 1px solid var(--line);

    border-radius: 9px;

    color: #737e8b;

    font-family: var(--mono);
    font-size: .7rem;
    line-height: 1.65;

    white-space: pre-wrap;
    font-variant-numeric: tabular-nums;
  }

  .log .ok {
    color: var(--ok);
  }

  .log .err {
    color: var(--bad);
  }

  .log .warn {
    color: var(--warn);
  }

  .log .api {
    color: var(--accent);
  }

  /* -----------------------------
     Modal
  ----------------------------- */

  .modal {
    position: fixed;
    inset: 0;
    z-index: 40;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 18px;

    background:
      rgba(4,6,9,.72);

    backdrop-filter: blur(9px);
    -webkit-backdrop-filter: blur(9px);
  }

  .modal.open {
    display: flex;
  }

  .modal-card {
    width: min(500px, 100%);

    max-height: 90vh;

    overflow: auto;

    padding: 18px;

    background:
      linear-gradient(
        180deg,
        rgba(255,255,255,.022),
        rgba(255,255,255,.008)
      ),
      #151a20;

    border: 1px solid #29313a;
    border-radius: var(--radius-lg);

    box-shadow: var(--shadow-lg);
  }

  .modal-card h2 {
    margin: 0;

    color: #f0f3f6;

    font-size: 1rem;
    font-weight: 750;
    letter-spacing: -.015em;
  }

  .field {
    margin-bottom: 15px;
  }

  .field label {
    display: block;

    margin-bottom: 6px;

    color: #adb6c0;

    font-size: .76rem;
    font-weight: 650;
  }

  .field small {
    display: block;

    margin-top: 5px;

    color: var(--muted-2);

    font-size: .7rem;
    line-height: 1.4;
  }

  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;

    padding: 10px 0;
  }

  .switch-row input {
    accent-color: var(--accent);
  }

  /* -----------------------------
     Toast
  ----------------------------- */

  .toast {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 50;

    max-width: min(380px, calc(100vw - 36px));

    padding: 11px 14px;

    background:
      linear-gradient(
        180deg,
        rgba(255,255,255,.025),
        rgba(255,255,255,.008)
      ),
      #171c22;

    border: 1px solid #303944;
    border-radius: 10px;

    color: #e9edf1;

    box-shadow: var(--shadow-lg);

    font-size: .8rem;
    font-weight: 600;

    animation:
      toastIn .18s ease-out;
  }

  @keyframes toastIn {
    from {
      opacity: 0;
      transform: translateY(8px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* -----------------------------
     Utilities
  ----------------------------- */

  .hidden {
    display: none !important;
  }

  /* -----------------------------
     Responsive
  ----------------------------- */

  @media (max-width: 760px) {
    .wrap {
      width: min(100% - 22px, 1080px);
      padding-top: 22px;
    }

    header {
      align-items: flex-start;
    }

    .brand h1 {
      font-size: 1.45rem;
    }

    .stats,
    .grid2 {
      grid-template-columns: 1fr 1fr;
    }

    .stats {
      gap: 7px;
    }

    .stat {
      padding: 12px 10px;
    }

    .row {
      align-items: stretch;
    }

    .grow {
      flex-basis: 100%;
    }

    select,
    .row > button {
      flex: 1 1 auto;
    }
  }

  @media (max-width: 520px) {
    .wrap {
      width: min(100% - 16px, 1080px);
      padding: 16px 0 40px;
    }

    header {
      gap: 12px;
      margin-bottom: 18px;
    }

    .brand p {
      font-size: .78rem;
    }

    .top-actions {
      gap: 5px;
    }

    .status {
      min-height: 32px;
      padding: 6px 9px;
      font-size: .73rem;
    }

    .stats,
    .grid2 {
      grid-template-columns: 1fr;
    }

    .panel {
      padding: 13px;
      border-radius: 11px;
    }

    .stats {
      grid-template-columns: 1fr 1fr;
    }

    .stat {
      text-align: left;
    }

    .meta {
      grid-template-columns: repeat(2, 1fr);
      row-gap: 5px;
    }

    .slot {
      min-height: 175px;
    }

    .banner {
      align-items: flex-start;
    }

    .banner button {
      margin-left: 0 !important;
    }

    .toast {
      left: 9px;
      right: 9px;
      bottom: 9px;
      max-width: none;
    }
  }

  /* -----------------------------
     Reduced motion
  ----------------------------- */

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
